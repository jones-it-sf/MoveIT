name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release

  publish:
    name: Publish Windows binaries
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish CLI
        run: dotnet publish src/MoveIT.Cli -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - name: Publish GUI
        run: dotnet publish src/MoveIT.Gui -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: moveit-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/moveit.exe
            artifacts/${{ matrix.rid }}/MoveIT-Wizard.exe
